name: Scanny
options:
  bundleIdPrefix: xyz.saltedchips
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "3"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
targets:
  Scanny:
    type: application
    platform: iOS
    sources: [Scanny]
    dependencies:
      - target: ScannyWidgets
    info:
      path: Scanny/Info.plist
      properties:
        CFBundleDisplayName: Scanny
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: xyz.saltedchips.scanny
            CFBundleURLSchemes: [scanny]
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: xyz.saltedchips.scanny.scan
            UIApplicationShortcutItemTitle: New Scan
            UIApplicationShortcutItemIconSymbolName: doc.viewfinder
          - UIApplicationShortcutItemType: xyz.saltedchips.scanny.import
            UIApplicationShortcutItemTitle: Import from Photos
            UIApplicationShortcutItemIconSymbolName: photo.on.rectangle
        NSCameraUsageDescription: Scanny uses the camera to scan documents. Nothing is stored or uploaded.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.saltedchips.scanny
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: Scanny
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  ScannyWidgets:
    type: app-extension
    platform: iOS
    sources: [ScannyWidgets]
    info:
      path: ScannyWidgets/Info.plist
      properties:
        CFBundleDisplayName: Scanny
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.saltedchips.scanny.widgets
        GENERATE_INFOPLIST_FILE: NO
